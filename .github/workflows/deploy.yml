name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set App Name
        run: |
          APP_NAME="${GITHUB_REPOSITORY##*/}"
          APK_NAME="${APP_NAME}.apk"

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

          echo "Application name: $APP_NAME"
          echo "APK name: $APK_NAME"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          mkdir -p RELEASE_KEY

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "RELEASE_KEY/universalprint_release.jks"

          test -s "RELEASE_KEY/universalprint_release.jks"

          keytool \
            -list \
            -keystore "RELEASE_KEY/universalprint_release.jks" \
            -storepass "$KEYSTORE_PASS" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Keystore verified."

      - name: Create signing.gradle
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          mkdir -p RELEASE_KEY

          printf '%s\n' \
            'android {' \
            '    signingConfigs {' \
            '        release {' \
            '            storeFile file("../RELEASE_KEY/universalprint_release.jks")' \
            '            storePassword System.getenv("KEYSTORE_PASS")' \
            '            keyAlias System.getenv("KEY_ALIAS")' \
            '            keyPassword System.getenv("KEYSTORE_PASS")' \
            '        }' \
            '    }' \
            '}' \
            > RELEASE_KEY/signing.gradle

          test -s RELEASE_KEY/signing.gradle

          echo "signing.gradle created."

      - name: Prepare Gradle
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Find Release APK
        run: |
          set -e

          APK=""

          while IFS= read -r FILE; do
            APK="$FILE"
            break
          done < <(
            find . \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              | sort
          )

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."

            echo "Available APK files:"
            find . -type f -name "*.apk" -print || true

            exit 1
          fi

          echo "APK found: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Align and Sign APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          BT=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d |
            sort -V |
            tail -1)

          if [ -z "$BT" ]; then
            echo "ERROR: Android build-tools not found."
            exit 1
          fi

          echo "Using Android Build Tools: $BT"

          "$BT/zipalign" \
            -p \
            -f \
            4 \
            "$APK_PATH" \
            aligned.apk

          "$BT/apksigner" sign \
            --ks "RELEASE_KEY/universalprint_release.jks" \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --key-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$APK_NAME" \
            aligned.apk

          "$BT/apksigner" verify \
            --verbose \
            "$APK_NAME"

          echo "APK signed successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="v${{ github.run_number }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."

            gh release upload \
              "$TAG" \
              "$APK_NAME" \
              --clobber
          else
            gh release create \
              "$TAG" \
              "$APK_NAME" \
              --title "$APP_NAME $TAG" \
              --notes "Automated Android release build for $APP_NAME."
          fi